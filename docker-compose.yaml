services:
  memory-gateway:
    image: python:3.12-slim
    container_name: memory-gateway
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - GATEWAY_AUTH_TOKEN=${GATEWAY_AUTH_TOKEN}
      - GATEWAY_HOST=${GATEWAY_HOST}
      - GATEWAY_PORT=${GATEWAY_PORT}
      - MINT_MASTER_SECRET=${MINT_MASTER_SECRET}
      - MEMORY_BACKEND_URL=${MEMORY_BACKEND_URL}
      - PYTHONPATH=/app/.venv/lib/python3.12/site-packages
    ports:
      - "100.75.87.51:8091:8091"
    networks:
      - platform_net
    command: >
      sh -c "python main.py"
    restart: unless-stopped

networks:
  platform_net:
    external: true
